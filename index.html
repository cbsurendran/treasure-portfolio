<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Treasure Portfolio</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="portfolio">
      <h1>My Portfolio</h1>

      <section class="map">
        <svg class="treasure-path" viewBox="0 0 900 600">
          <path
            d="M180 150 
                        C300 100, 350 300, 500 250
                        C650 200, 600 400, 750 450 "
          />
        </svg>

        <div class="location about">
          <h2>About Me</h2>
        </div>

        <button class="location projects" id="projectsButton">
          <h2>Projects</h2>
        </button>

        <div class="project-card" id="projectCard">
          <button class="close-button" id="closeButton">✕</button>

          <div class="chest">💰</div>

          <h2>Treasure Found!</h2>

          <h3>My First Project</h3>

          <p>
            This is where I'll tell the story of my project, what I built, and
            what I learned.
          </p>

          <button class="view-button">View Project</button>
        </div>

        <div class="location skills">
          <h2>Skills</h2>
        </div>

        <div class="location contact">
          <h2>Contact</h2>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
